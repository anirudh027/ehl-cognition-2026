[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-bioengineering"
version = "0.1.0"
description = "CPU-native bioinformatics pipeline and local orchestration dashboard"
requires-python = ">=3.12"
dependencies = [
  "biopython==1.88",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema",
  "numpy",
  "pandas",
  "pydantic==2.13.4",
  "scipy",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.12.7",
]

[project.scripts]
bioctl = "bio_tools.cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "bio_tools*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
